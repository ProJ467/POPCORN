<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Project - POPCORN</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #0f0f0f;

            color: white;

            font-family: Arial, sans-serif;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            padding: 0 30px;

            display: flex;

            align-items: center;

            background: #151515;

            border-bottom: 1px solid #292929;
        }


        .logo {

            font-size: 26px;

            font-weight: bold;
        }


        .logo span {

            margin-right: 8px;
        }


        .back {

            margin-left: 30px;

            color: #aaa;

            text-decoration: none;

            transition: 0.2s;
        }


        .back:hover {

            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 100%;

            max-width: 1000px;

            margin: 50px auto;

            padding: 0 20px;
        }


        .project-card {

            background: #191919;

            border: 1px solid #292929;

            border-radius: 18px;

            padding: 25px;
        }


        .project-title {

            font-size: 32px;

            margin: 0 0 10px;
        }


        .project-description {

            color: #888;

            margin-bottom: 25px;
        }


        /* =========================
           VIDEO
        ========================= */

        .video-container {

            width: 100%;

            background: #000;

            border-radius: 15px;

            overflow: hidden;

            margin-top: 20px;
        }


        .video-player {

            width: 100%;

            max-height: 600px;

            display: block;

            background: #000;
        }


        /* =========================
           AUDIO
        ========================= */

        .audio-container {

            margin-top: 20px;

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #202020,
                    #151515
                );

            border: 1px solid #303030;

            border-radius: 15px;
        }


        .audio-header {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }


        .audio-icon {

            width: 55px;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #292929;

            border-radius: 13px;

            font-size: 28px;
        }


        .audio-title {

            font-size: 18px;

            font-weight: bold;
        }


        .audio-subtitle {

            color: #888;

            font-size: 13px;

            margin-top: 4px;
        }


        .audio-player {

            width: 100%;

            height: 45px;
        }


        /* =========================
           IMAGE
        ========================= */

        .image-container {

            margin-top: 20px;

            background: #111;

            border-radius: 15px;

            overflow: hidden;

            text-align: center;
        }


        .image-preview {

            max-width: 100%;

            max-height: 700px;

            display: block;

            margin: auto;
        }


        /* =========================
           OTHER FILE
        ========================= */

        .file-box {

            margin-top: 20px;

            padding: 25px;

            background: #111;

            border-radius: 12px;

            text-align: center;
        }


        .open-button {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 18px;

            background: #292929;

            color: white;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }


        .open-button:hover {

            background: #383838;

            transform: scale(1.02);
        }

        /* =========================
           DELETE BUTTON
        ========================= */

        .delete-button {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 18px;

            background: #ff4444;

            color: white;

            border: none;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .delete-button:hover {

            background: #cc0000;

            transform: scale(1.02);
        }

        .delete-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }

        .action-buttons {

            margin-top: 30px;

            display: flex;

            gap: 15px;

            flex-wrap: wrap;
        }


        /* =========================
           ERROR
        ========================= */

        .error {

            padding: 30px;

            background: #191919;

            border: 1px solid #292929;

            border-radius: 15px;

            color: #ff7777;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {

                padding: 0 15px;
            }


            .project-card {

                padding: 18px;
            }


            .project-title {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <span>🍿</span>

        POPCORN

    </div>


    <a
        href="index.html"
        class="back"
    >

        ← Back

    </a>

</header>


<main>

    <div
        id="project"
        class="project-card"
    >

        Loading project... 🍿

    </div>

</main>


<script>

    const LOCAL_SERVER = "http://127.0.0.1:8000";

    function detectServer() {
        if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
            return LOCAL_SERVER;
        }

        if (window.POPCORN_SERVER) {
            return window.POPCORN_SERVER;
        }

        return location.origin;
    }

    const server = detectServer();


    // =========================
    // GET FILE NAME
    // =========================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const filename =
        params.get("file");


    const project =
        document.getElementById(
            "project"
        );


    // =========================
    // NO FILE
    // =========================

    if (!filename) {

        project.innerHTML = `

            <div class="error">

                ❌ No project specified.

            </div>

        `;

    }


    // =========================
    // LOAD PROJECT
    // =========================

    async function loadProject() {

        try {

            const response =
                await fetch(
                    server + "/files"
                );


            if (!response.ok) {

                throw new Error(
                    "Could not connect to POPCORN server."
                );

            }


            const data =
                await response.json();


            const file =
                data.files.find(
                    item =>
                        item.filename === filename
                );


            if (!file) {

                project.innerHTML = `

                    <div class="error">

                        ❌ Project not found.

                    </div>

                `;

                return;

            }


            showProject(file);

        }

        catch (error) {

            console.error(error);


            project.innerHTML = `

                <div class="error">

                    ❌ ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

        }

    }


    // =========================
    // SHOW PROJECT
    // =========================

    function showProject(file) {

        project.innerHTML = "";


        const title =
            document.createElement(
                "h1"
            );


        title.className =
            "project-title";


        title.textContent =
            file.filename;


        const description =
            document.createElement(
                "p"
            );


        description.className =
            "project-description";


        description.textContent =
            "Published on POPCORN 🍿";


        project.appendChild(
            title
        );


        project.appendChild(
            description
        );


        const mediaUrl =
            server +
            "/media/" +
            encodeURIComponent(
                file.filename
            );


        // =====================
        // MP4
        // =====================

        if (
            file.type === "video"
        ) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "video-container";


            const video =
                document.createElement(
                    "video"
                );


            video.className =
                "video-player";


            video.controls =
                true;


            video.preload =
                "metadata";


            video.playsInline =
                true;


            video.src =
                mediaUrl;


            video.addEventListener(
                "error",
                function () {

                    container.insertAdjacentHTML(
                        "afterend",
                        `
                        <div class="error">
                            ❌ This MP4 could not be played.
                        </div>
                        `
                    );

                }
            );


            container.appendChild(
                video
            );


            project.appendChild(
                container
            );

        }


        // =====================
        // MP3
        // =====================

        else if (
            file.type === "audio"
        ) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "audio-container";


            container.innerHTML = `

                <div class="audio-header">

                    <div class="audio-icon">
                        🎵
                    </div>

                    <div>

                        <div class="audio-title">
                            POPCORN Audio
                        </div>

                        <div class="audio-subtitle">
                            ${escapeHtml(
                                file.filename
                            )}
                        </div>

                    </div>

                </div>

            `;


            const audio =
                document.createElement(
                    "audio"
                );


            audio.className =
                "audio-player";


            audio.controls =
                true;


            audio.preload =
                "metadata";


            audio.src =
                mediaUrl;


            container.appendChild(
                audio
            );


            project.appendChild(
                container
            );

        }


        // =====================
        // IMAGE
        // =====================

        else if (
            file.type === "image"
        ) {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "image-container";


            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "image-preview";


            image.src =
                mediaUrl;


            image.alt =
                file.filename;


            container.appendChild(
                image
            );


            project.appendChild(
                container
            );

        }


        // =====================
        // OTHER FILES
        // =====================

        else {

            const container =
                document.createElement(
                    "div"
                );


            container.className =
                "file-box";


            container.innerHTML = `

                📦

                <br>

                This project is a file.

            `;


            const button =
                document.createElement(
                    "a"
                );


            button.className =
                "open-button";


            button.href =
                mediaUrl;


            button.target =
                "_blank";


            button.textContent =
                "↗ Open file";


            container.appendChild(
                button
            );


            project.appendChild(
                container
            );

        }


        // =====================
        // ACTION BUTTONS
        // =====================

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "action-buttons";


        const deleteBtn =
            document.createElement(
                "button"
            );


        deleteBtn.className =
            "delete-button";


        deleteBtn.textContent =
            "🗑️ Delete";


        deleteBtn.onclick =
            deleteProject;


        actions.appendChild(
            deleteBtn
        );


        project.appendChild(
            actions
        );

    }


    // =========================
    // HTML ESCAPE
    // =========================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    // =========================
    // DELETE PROJECT
    // =========================

    async function deleteProject() {

        const confirm_delete =
            confirm(
                `Are you sure you want to delete "${filename}"? This cannot be undone.`
            );


        if (!confirm_delete) {
            return;
        }


        try {

            const response =
                await fetch(
                    server + "/files/" + encodeURIComponent(filename),
                    {
                        method: "DELETE"
                    }
                );


            if (!response.ok) {

                const error_data =
                    await response.json();

                throw new Error(
                    error_data.detail ||
                    "Failed to delete file"
                );

            }


            alert("✅ File deleted successfully!");

            window.location.href =
                "index.html";

        }

        catch (error) {

            console.error(error);

            alert(
                "❌ Error deleting file: " + error.message
            );

        }

    }


    // =========================
    // HTML ESCAPE
    // =========================

    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }


    // =========================
    // START
    // =========================

    if (filename) {

        loadProject();

    }

</script>


</body>

</html>
