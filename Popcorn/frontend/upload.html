<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Upload - POPCORN</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #0f0f0f;

            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 70px;

            padding: 0 30px;

            display: flex;

            align-items: center;

            background: #151515;

            border-bottom: 1px solid #292929;
        }


        .logo {

            font-size: 26px;

            font-weight: bold;
        }


        .logo span {

            margin-right: 8px;
        }


        .back {

            margin-left: 30px;

            color: #aaa;

            text-decoration: none;

            transition: 0.2s;
        }


        .back:hover {

            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 100%;

            max-width: 900px;

            margin: 60px auto;

            padding: 0 20px;
        }


        h1 {

            font-size: 38px;

            margin-bottom: 10px;
        }


        .subtitle {

            color: #888;

            margin-bottom: 35px;
        }


        /* =========================
           UPLOAD BOX
        ========================= */

        .upload-box {

            padding: 60px 30px;

            text-align: center;

            background: #191919;

            border: 2px dashed #444;

            border-radius: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        .upload-box:hover {

            border-color: #666;
        }


        .upload-box.dragging {

            border-color: #ffcc00;

            background: #222;

            transform: scale(1.01);
        }


        .upload-icon {

            font-size: 65px;

            margin-bottom: 20px;
        }


        .upload-box h2 {

            margin-bottom: 10px;
        }


        .upload-box p {

            color: #888;

            margin-bottom: 25px;
        }


        #fileInput {

            display: none;
        }


        .choose-button {

            display: inline-block;

            padding: 13px 22px;

            background: #292929;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .choose-button:hover {

            background: #333;

            transform: scale(1.03);
        }


        /* =========================
           FILE INFO
        ========================= */

        .file-info {

            margin-top: 25px;

            padding: 15px;

            background: #151515;

            border-radius: 10px;

            color: #aaa;

            word-break: break-word;
        }


        /* =========================
           PUBLISH
        ========================= */

        .publish-button {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #ffcc00;

            color: #111;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .publish-button:hover:not(:disabled) {

            transform: scale(1.01);
        }


        .publish-button:disabled {

            opacity: 0.4;

            cursor: not-allowed;
        }


        /* =========================
           FILE SECTION
        ========================= */

        .uploaded-section {

            margin-top: 55px;
        }


        .uploaded-section h2 {

            margin-bottom: 20px;
        }


        .file-list {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* =========================
           FILE CARD
        ========================= */

        .file-item {

            padding: 18px;

            background: #191919;

            border: 1px solid #292929;

            border-radius: 16px;

            transition: 0.2s;
        }


        .file-item:hover {

            border-color: #444;

            transform: translateY(-2px);
        }


        .file-header {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 15px;
        }


        .file-icon {

            width: 48px;

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #111;

            border-radius: 11px;

            font-size: 25px;

            flex-shrink: 0;
        }


        .file-name {

            flex: 1;

            color: #ddd;

            font-weight: bold;

            word-break: break-word;
        }


        /* =========================
           DELETE
        ========================= */

        .delete-file {

            padding: 9px 13px;

            border: 1px solid #444;

            border-radius: 9px;

            background: #222;

            color: #aaa;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

            flex-shrink: 0;
        }


        .delete-file:hover {

            background: #333;

            color: white;

            transform: scale(1.03);
        }


        .delete-file:disabled {

            opacity: 0.5;

            cursor: wait;

            transform: none;
        }


        /* =========================
           VIDEO
        ========================= */

        .video-preview {

            width: 100%;

            max-height: 500px;

            display: block;

            background: #000;

            border-radius: 12px;

            margin-top: 10px;
        }


        /* =========================
           AUDIO
        ========================= */

        .audio-preview {

            width: 100%;

            margin-top: 12px;

            border-radius: 10px;
        }


        .audio-box {

            padding: 18px;

            background: #111;

            border-radius: 12px;

            margin-top: 10px;
        }


        .audio-title {

            margin-bottom: 10px;

            color: #bbb;

            font-size: 14px;
        }


        /* =========================
           IMAGE
        ========================= */

        .image-preview {

            width: 100%;

            max-height: 500px;

            object-fit: contain;

            display: block;

            background: #111;

            border-radius: 12px;

            margin-top: 10px;
        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-file {

            display: inline-block;

            margin-top: 12px;

            padding: 9px 14px;

            border-radius: 9px;

            background: #292929;

            color: #ddd;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }


        .open-file:hover {

            background: #333;

            color: white;
        }


        /* =========================
           EMPTY
        ========================= */

        .no-files {

            padding: 25px;

            text-align: center;

            color: #777;

            background: #151515;

            border-radius: 12px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {

                padding: 0 15px;
            }


            .back {

                margin-left: 15px;
            }


            .file-header {

                align-items: flex-start;
            }


            .delete-file {

                padding: 8px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        <span>🍿</span>

        POPCORN

    </div>


    <a
        href="index.html"
        class="back"
    >

        ← Back to POPCORN

    </a>

</header>


<main>


    <h1>

        Upload your project 🍿

    </h1>


    <p class="subtitle">

        Share your creation with the POPCORN community.

    </p>


    <!-- =========================
         UPLOAD
    ========================= -->

    <div
        class="upload-box"
        id="uploadBox"
    >

        <div class="upload-icon">

            📁

        </div>


        <h2>

            Drop your file here

        </h2>


        <p>

            or choose a file from your computer

        </p>


        <label
            for="fileInput"
            class="choose-button"
        >

            Choose File

        </label>


        <input
            type="file"
            id="fileInput"
        >

    </div>


    <div
        class="file-info"
        id="fileInfo"
    >

        No file selected.

    </div>


    <button
        class="publish-button"
        id="publishButton"
        disabled
    >

        🚀 Publish Project

    </button>


    <!-- =========================
         FILES
    ========================= -->

    <section class="uploaded-section">

        <h2>

            📦 Your Uploaded Files

        </h2>


        <div
            class="file-list"
            id="fileList"
        >

            <div class="no-files">

                Loading files... 🍿

            </div>

        </div>

    </section>


</main>


<script>


    // =========================
    // SERVER
    // =========================

    const LOCAL_SERVER = "http://127.0.0.1:8000";

    function detectServer() {
        // If opened as a file (file://) or no hostname, prefer the local server for development
        if (location.protocol === 'file:' || !location.hostname) {
            return LOCAL_SERVER;
        }

        if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
            return LOCAL_SERVER;
        }

        if (window.POPCORN_SERVER) {
            return window.POPCORN_SERVER;
        }

        return location.origin;
    }

    const server = detectServer();


    // =========================
    // ELEMENTS
    // =========================

    const fileInput =
        document.getElementById(
            "fileInput"
        );


    const uploadBox =
        document.getElementById(
            "uploadBox"
        );


    const fileInfo =
        document.getElementById(
            "fileInfo"
        );


    const publishButton =
        document.getElementById(
            "publishButton"
        );


    const fileList =
        document.getElementById(
            "fileList"
        );


    // =========================
    // SELECT FILE
    // =========================

    fileInput.addEventListener(
        "change",
        function () {

            if (
                fileInput.files.length === 0
            ) {

                fileInfo.innerText =
                    "No file selected.";

                publishButton.disabled =
                    true;

                return;
            }


            const file =
                fileInput.files[0];


            const size =
                (
                    file.size /
                    1024
                ).toFixed(2);


            fileInfo.innerText =
                `Selected: ${file.name} (${size} KB)`;


            publishButton.disabled =
                false;

        }
    );


    // =========================
    // DRAG OVER
    // =========================

    uploadBox.addEventListener(
        "dragover",
        function (event) {

            event.preventDefault();

            uploadBox.classList.add(
                "dragging"
            );

        }
    );


    // =========================
    // DRAG LEAVE
    // =========================

    uploadBox.addEventListener(
        "dragleave",
        function () {

            uploadBox.classList.remove(
                "dragging"
            );

        }
    );


    // =========================
    // DROP
    // =========================

    uploadBox.addEventListener(
        "drop",
        function (event) {

            event.preventDefault();

            uploadBox.classList.remove(
                "dragging"
            );


            const files =
                event.dataTransfer.files;


            if (
                files.length === 0
            ) {

                return;
            }


            fileInput.files =
                files;


            fileInput.dispatchEvent(
                new Event("change")
            );

        }
    );


    // =========================
    // UPLOAD
    // =========================

    publishButton.addEventListener(
        "click",
        async function () {

            const file =
                fileInput.files[0];


            if (!file) {

                return;
            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            publishButton.disabled =
                true;


            publishButton.innerText =
                "⏳ Uploading...";


            try {

                const response =
                    await fetch(
                        server +
                        "/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.detail ||
                        "Upload failed."
                    );
                }


                fileInfo.innerText =
                    "✅ Project uploaded successfully!";


                fileInput.value =
                    "";


                publishButton.innerText =
                    "🚀 Publish Project";


                publishButton.disabled =
                    true;


                await loadFiles();

            }

            catch (error) {

                console.error(error);


                fileInfo.innerText =
                    "❌ " +
                    error.message;


                publishButton.innerText =
                    "🚀 Publish Project";


                publishButton.disabled =
                    false;

            }

        }
    );


    // =========================
    // LOAD FILES
    // =========================

    async function loadFiles() {

        try {

            const response =
                await fetch(
                    server +
                    "/files"
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load files."
                );
            }


            const data =
                await response.json();


            displayFiles(
                data.files
            );

        }

        catch (error) {

            console.error(error);


            fileList.innerHTML = `

                <div class="no-files">

                    ❌ Could not load files.

                </div>

            `;

        }

    }


    // =========================
    // DISPLAY FILES
    // =========================

    function displayFiles(files) {

        fileList.innerHTML =
            "";


        if (
            files.length === 0
        ) {

            fileList.innerHTML = `

                <div class="no-files">

                    🍿 No uploaded files yet.

                </div>

            `;

            return;
        }


        files.forEach(
            file => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "file-item";


                // =====================
                // HEADER
                // =====================

                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "file-header";


                // =====================
                // ICON
                // =====================

                const icon =
                    document.createElement(
                        "div"
                    );


                icon.className =
                    "file-icon";


                if (
                    file.type === "video"
                ) {

                    icon.textContent =
                        "🎬";

                }

                else if (
                    file.type === "audio"
                ) {

                    icon.textContent =
                        "🎵";

                }

                else if (
                    file.type === "image"
                ) {

                    icon.textContent =
                        "🖼️";

                }

                else {

                    icon.textContent =
                        "📦";

                }


                // =====================
                // NAME
                // =====================

                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "file-name";


                name.textContent =
                    file.filename;


                // =====================
                // DELETE
                // =====================

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete-file";


                deleteButton.textContent =
                    "🗑 Delete";


                deleteButton.addEventListener(
                    "click",
                    function () {

                        deleteFile(
                            file.filename,
                            deleteButton
                        );

                    }
                );


                header.appendChild(
                    icon
                );


                header.appendChild(
                    name
                );


                header.appendChild(
                    deleteButton
                );


                item.appendChild(
                    header
                );


                // =====================
                // MP4
                // =====================

                if (
                    file.type === "video"
                ) {

                    const video =
                        document.createElement(
                            "video"
                        );


                    video.className =
                        "video-preview";


                    video.controls =
                        true;


                    video.preload =
                        "metadata";


                    video.src =
                        server +
                        "/media/" +
                        encodeURIComponent(
                            file.filename
                        );


                    item.appendChild(
                        video
                    );

                }


                // =====================
                // MP3
                // =====================

                else if (
                    file.type === "audio"
                ) {

                    const audioBox =
                        document.createElement(
                            "div"
                        );


                    audioBox.className =
                        "audio-box";


                    const audioTitle =
                        document.createElement(
                            "div"
                        );


                    audioTitle.className =
                        "audio-title";


                    audioTitle.textContent =
                        "🎵 POPCORN Audio";


                    const audio =
                        document.createElement(
                            "audio"
                        );


                    audio.className =
                        "audio-preview";


                    audio.controls =
                        true;


                    audio.preload =
                        "metadata";


                    audio.src =
                        server +
                        "/media/" +
                        encodeURIComponent(
                            file.filename
                        );


                    audioBox.appendChild(
                        audioTitle
                    );


                    audioBox.appendChild(
                        audio
                    );


                    item.appendChild(
                        audioBox
                    );

                }


                // =====================
                // IMAGE
                // =====================

                else if (
                    file.type === "image"
                ) {

                    const image =
                        document.createElement(
                            "img"
                        );


                    image.className =
                        "image-preview";


                    image.alt =
                        file.filename;


                    image.src =
                        server +
                        "/media/" +
                        encodeURIComponent(
                            file.filename
                        );


                    item.appendChild(
                        image
                    );

                }


                // =====================
                // OTHER FILES
                // =====================

                else {

                    const open =
                        document.createElement(
                            "a"
                        );


                    open.className =
                        "open-file";


                    open.href =
                        server +
                        "/media/" +
                        encodeURIComponent(
                            file.filename
                        );


                    open.target =
                        "_blank";


                    open.textContent =
                        "↗ Open file";


                    item.appendChild(
                        open
                    );

                }


                fileList.appendChild(
                    item
                );

            }
        );

    }


    // =========================
    // DELETE
    // =========================

    async function deleteFile(
        filename,
        button
    ) {

        const confirmed =
            confirm(
                `Delete "${filename}"?`
            );


        if (!confirmed) {

            return;
        }


        button.disabled =
            true;


        button.textContent =
            "⏳ Deleting...";


        try {

            const response =
                await fetch(
                    server +
                    "/files/" +
                    encodeURIComponent(
                        filename
                    ),
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.detail ||
                    "Delete failed."
                );
            }


            fileInfo.innerText =
                `🗑 "${filename}" deleted successfully!`;


            await loadFiles();

        }

        catch (error) {

            console.error(
                "DELETE ERROR:",
                error
            );


            fileInfo.innerText =
                "❌ Failed to delete file: " +
                error.message;


            button.disabled =
                false;


            button.textContent =
                "🗑 Delete";

        }

    }


    // =========================
    // START
    // =========================

    loadFiles();

</script>


</body>

</html>
